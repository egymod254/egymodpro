async function pull(man){if(!CF.u||!on||sy)return;if(man&&q&&!confirm('يوجد '+q+' تعديل لم يُرسل وسيُستبدل. متابعة؟'))return;
 try{const j=await post({action:'load'});if(!j.ok)throw 0;if(j.data&&(man||(+j.ts>+(lsg('hr-ts')||0)&&!q))){S=j.data;persist();lss('hr-ts',j.ts);q=0;lss('hr-q',0);say('تم تحميل آخر بيانات من الشيت');render()}else if(man)say('لا توجد بيانات في الشيت بعد')}catch(e){if(man)say('تعذر الاتصال بالشيت')}}
async function saveCF(){const u=$('cu').value.trim(),k=$('ck').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){say('الرابط غير صحيح');return}CF={u,k};lss('hr-cfg',JSON.stringify(CF));
 try{const j=await post({action:'ping'});if(!j.ok)throw 0;say('تم الاتصال بنجاح ✓');await pull();await sync(true)}catch(e){say('فشل الاتصال، راجع الرابط وكلمة السر')}}
function done(m){q++;lss('hr-q',q);persist();render();if(on){clearTimeout(dt);dt=setTimeout(sync,1200)}else say(m||'تم الحفظ على الهاتف وسيُرسل عند عودة الإنترنت')}
addEventListener('online',()=>{on=true;render();pull().then(()=>sync())});addEventListener('offline',()=>{on=false;render()});
const go=(v,k,c)=>{from=V==='sec'&&v==='hub'?'hub':V;if(k)K=k;if(c!==undefined)cur=S.E.find(e=>e.c===c);V=v;if(v==='sec')pick(21);else render();scrollTo(0,0)};
function back(){if(V==='sec')V=from==='mod'?'mod':'hub';else V='home';render();scrollTo(0,0)}
function pick(d){const r=(S.ot[cur.c]||{})[d];ed=K==='ot'?(r?{d,...r}:{d,i:'',ip:'ص',o:'',op:'م',nx:0}):{d,v:''};render();const x=document.querySelector('.dy.on');if(x)x.scrollIntoView({inline:'center',block:'nearest'})}
const hdr=(t,s,x)=>`<header><div class="r">${V==='home'?'':'<button class="ib" onclick="back()" aria-label="رجوع">›</button>'}<div><h1>${t}</h1>${s?`<div class="sub">${s}</div>`:''}</div><span class="sp"></span>${chip()}${V==='home'?'<button class="ib" onclick="go(\'exp\')">الربط</button><button class="ib" onclick="theme()" aria-label="المظهر">◐</button>':''}</div>${x||''}</header>`;
function home(){const g=Object.keys(M).map((k,i)=>{const t=S.E.reduce((a,e)=>a+(k==='ot'?mo(e.c):k==='lv'?(bal(S.lv[e.c]||[],e.h)||{net:0}).net:sum(S[k][e.c])),0);
  return`<button class="mc ${i?'':'w'}" style="--m:${M[k].c}" onclick="go('mod','${k}')"><small>${M[k].n}</small><b>${k==='ot'?hm(t):k==='adv'?t.toLocaleString('en'):r2(t)}</b> <span>${k==='ot'?'ساعة':k==='adv'?'ج.م':'يوم'}</span></button>`}).join('');
 return hdr('شؤون الموظفين','أكتوبر 2026 · '+S.E.length+' موظف')+`<div class="grid">${g}</div><input class="srch" placeholder="ابحث عن موظف بالاسم أو الكود" value="${srch}" oninput="srch=this.value;$('ls').innerHTML=rows('hub')"><div id="ls">${rows('hub')}</div><div class="ft">البيانات تُحفظ على الهاتف وتُرحَّل تلقائياً إلى جوجل شيت.</div>`}
function rows(v){const s=norm(srch).toLowerCase();return S.E.filter(e=>!s||(e.n+e.c).toLowerCase().includes(s)).map(e=>{const x=v==='hub'?'':sm(K,e);
 return`<button class="emp" style="--m:${M[K].c}" onclick="go('${v==='hub'?'hub':'sec'}'${v==='hub'?'':",K"},'${e.c}')">${e.n}${v==='hub'?'<u>›</u>':`<i>${x[0]} ${x[1]}</i>`}</button>`}).join('')||'<div class="ft">لا يوجد موظف بهذا الاسم.</div>'}
function mod(){return hdr(M[K].n,'كل الموظفين · اختر موظفاً لعرض سجله')+`<div style="margin-top:12px">${rows('sec')}</div>`}
function hub(){const e=cur;return hdr(e.n,e.c+(e.h?' · تعيين '+e.h:''))+`<div class="grid">${Object.keys(M).map(k=>{const x=sm(k,e);return`<button class="mc" style="--m:${M[k].c}" onclick="go('sec','${k}')"><small>${M[k].n}</small><b>${x[0]}</b> <span>${x[1]}</span></button>`}).join('')}</div>`}
function sec(){const e=cur,c=e.c,m=M[K],st=(a,b,d)=>`<div><span>${a}</span><b>${b}</b></div>`;let x,body;
 if(K==='ot'){x=`<div class="st" style="--m:${m.c}"><div><span>المستحق</span><b class="am">${hm((S.k[c]||0)+mo(c))}</b></div>${st('إضافي الشهر',hm(mo(c)))}<div><span>المرحل</span><input class="cin" value="${hm(S.k[c]||0)}" onchange="setK(this.value)" inputmode="decimal"></div></div>`;
  const D=S.ot[c]||{},L=Object.keys(D).map(Number).sort((a,b)=>b-a).map(d=>{const r=D[d],k=calc(r);return k.err||k.w===null?'':`<div class="rec"><div class="d">${d}</div><div>${tt(k.i)} ← ${tt(k.o)}${r.nx?' (اليوم التالي)':''}<small>ساعات العمل ${hc(k.w)}</small></div><div class="x">${k.ot?'+'+hm(k.ot):'—'}</div><button class="del" onclick="del(${d})">✕</button></div>`}).join('');
  body=`<div class="c"><div class="tm"><div class="col"><label>وقت الحضور</label><input class="t" inputmode="decimal" value="${ed.i}" oninput="ed.i=this.value;pv()" placeholder="7"><div class="seg"><button class="${ed.ip==='ص'?'on':''}" onclick="sg('ip','ص')">ص</button><button class="${ed.ip==='م'?'on':''}" onclick="sg('ip','م')">م</button></div></div><div class="col"><label>وقت الانصراف</label><input class="t" inputmode="decimal" value="${ed.o}" oninput="ed.o=this.value;pv()" placeholder="5.30"><div class="seg"><button class="${ed.op==='ص'?'on':''}" onclick="sg('op','ص')">ص</button><button class="${ed.op==='م'?'on':''}" onclick="sg('op','م')">م</button></div></div></div>
  <button class="tg ${ed.nx?'on':''}" onclick="ed.nx=ed.nx?0:1;render()"><span>تاني يوم<br><small style="font-weight:400;color:var(--mut)">الانصراف في اليوم التالي (+24 ساعة)</small></span><i></i></button><div class="pv" id="pv">${pvh()}</div><button class="pri" onclick="sv()">حفظ يوم ${ed.d}</button></div><div class="c"><b>الأيام المسجلة</b>${L||'<div class="ft">لا توجد أيام مسجلة.</div>'}</div>`}
 else if(K==='lv'){const L=S.lv[c]||[],b=bal(L,e.h);x=`<div class="st" style="--m:${m.c}"><div><span>المتبقي</span><b class="am">${b?b.net:'—'}</b></div>${st('المستحق',b?b.ent:'—')}${st('المأخوذ',b?b.tk:sum({}))}</div>`;
  body=`<div class="c"><div class="tm"><div class="col"><label>تاريخ الإجازة</label><input class="t" type="date" id="lf" style="font-size:15px"></div><div class="col"><label>تاريخ العودة</label><input class="t" type="date" id="lt" style="font-size:15px"></div></div><button class="pri" onclick="addL()">إضافة إجازة</button>${e.h?'':'<div class="ft">لا يوجد تاريخ تعيين لهذا الموظف في ملف الإجازات.</div>'}</div>
  <div class="c"><b>سجل الإجازات</b>${L.map((r,i)=>`<div class="rec"><div class="d">${lvD(r)}</div><div>${r.f} ← ${r.t||'مفتوحة'}<small>${r.t?'يوم':'محسوبة حتى اليوم'}</small></div><span class="x"></span><button class="del" onclick="delL(${i})">✕</button></div>`).reverse().join('')||'<div class="ft">لا توجد إجازات.</div>'}</div>`}
 else{const D=S[K][c]||{},ds=Object.keys(D).map(Number).sort((a,b)=>b-a),u=K==='adv'?'ج.م':'يوم';x=`<div class="st" style="--m:${m.c}"><div><span>الإجمالي (${u})</span><b class="am">${sm(K,e)[0]}</b></div>${st('عدد المرات',ds.length)}${st('الشهر','أكتوبر')}</div>`;
  body=`<div class="c"><label>${K==='adv'?'مبلغ السلفة (ج.م)':K==='pen'?'أيام الخصم':'أيام الغياب'} — يوم ${ed.d}</label><input class="t" inputmode="decimal" id="vv" value="${ed.v}" oninput="ed.v=this.value" placeholder="${K==='adv'?'500':'1'}">${K==='adv'?'':'<div class="chs">'+[0.5,1,1.5,2].map(v=>`<button onclick="$('vv').value=ed.v=${v}">${v}</button>`).join('')+'</div>'}<button class="pri" style="margin-top:10px" onclick="addV()">حفظ</button></div>
  <div class="c"><b>السجل</b>${ds.map(d=>`<div class="rec"><div class="d">${d}</div><div>يوم ${d} أكتوبر</div><div class="x">${D[d]} ${u}</div><button class="del" onclick="del(${d})">✕</button></div>`).join('')||'<div class="ft">لا توجد سجلات.</div>'}</div>`}
 const days=(K==='lv')?'':`<div class="strip" style="--m:${m.c}">${Array.from({length:DAYS},(_,i)=>i+1).map(d=>`<button class="dy ${d===ed.d?'on':''} ${((K==='ot'?S.ot:S[K])[c]||{})[d]?'has':''}" onclick="pick(${d})">${d}</button>`).join('')}</div>`;
 return hdr(e.n,m.n).replace('</header>',x+'</header>')+days+`<div style="--m:${m.c}">${body}</div>`}
function pvh(){const k=calc(ed);if(k.err)return'<span class="e">وقت غير مفهوم، اكتب مثل 7 أو 7.30 أو 5:45</span>';if(k.w===null)return'<span>اكتب الحضور والانصراف</span>';return`<div><b>${hc(k.w)}</b><span>ساعات العمل</span></div><div class="o"><b>${hm(k.ot)}</b><span>الإضافي</span></div><div><b>${tt(k.i)}</b><span>الحضور</span></div>`}
const pv=()=>{$('pv').innerHTML=pvh()},sg=(f,v)=>{ed[f]=v;render()};
function sv(){const k=calc(ed);if(k.err||k.w===null){say('اكتب وقت حضور وانصراف صحيحين أولاً');return}(S.ot[cur.c]=S.ot[cur.c]||{})[ed.d]={i:ed.i,ip:ed.ip,o:ed.o,op:ed.op,nx:ed.nx};done()}
function addV(){const v=+norm($('vv').value);if(!(v>0)||(K!=='adv'&&v>31)){say('اكتب قيمة صحيحة أكبر من صفر');return}(S[K][cur.c]=S[K][cur.c]||{})[ed.d]=K==='adv'?v:r2(v);ed.v='';done()}
function del(d){delete(K==='ot'?S.ot:S[K])[cur.c][d];done('تم الحذف')}
function addL(){const f=$('lf').value,t=$('lt').value;if(!f||(t&&t<=f)){say('تاريخ الإجازة مطلوب والعودة بعده');return}(S.lv[cur.c]=S.lv[cur.c]||[]).push(t?{f,t}:{f});done()}
function delL(i){const L=S.lv[cur.c];L.splice(L.length-1-i,1);done('تم الحذف')}
function setK(v){const m=hmParse(v);if(m===null){say('اكتب المرحل مثل 1.30');render();return}S.k[cur.c]=m;done()}
function rowsOf(k){const R=[];S.E.forEach(e=>{const c=e.c;if(k==='ot'){if(S.k[c])R.push(['الإضافي',c,e.n,'مرحل','',hm(S.k[c]),'']);Object.keys(S.ot[c]||{}).forEach(d=>{const r=S.ot[c][d],z=calc(r);if(z.w!==null&&!z.err)R.push(['الإضافي',c,e.n,d,'',hm(z.ot),tt(z.i)+' ← '+tt(z.o)+(r.nx?' (اليوم التالي)':'')])})}
 else if(k==='lv')(S.lv[c]||[]).forEach(r=>R.push(['الإجازات',c,e.n,r.f,r.t||'',lvD(r),r.t?'':'مفتوحة']));else Object.keys(S[k][c]||{}).forEach(d=>R.push([M[k].n,c,e.n,d,'',S[k][c][d],'']))});return R}
const HD=['القسم','الكود','الاسم','اليوم / من','إلى','القيمة','ملاحظة'];
const csv=R=>'\ufeff'+R.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
async function exp(kind){let R,fn;if(kind==='sum'){R=[['الكود','الاسم','الإضافي المستحق','الجزاءات (يوم)','الغياب (يوم)','السلف (ج.م)','رصيد الإجازات']].concat(S.E.map(e=>[e.c,e.n].concat(['ot','pen','ab','adv','lv'].map(k=>sm(k,e)[0]))));fn='الشيت-المجمع.csv'}
 else if(kind==='all'){R=[HD].concat(...Object.keys(M).map(rowsOf));fn='السجل-المفصل.csv'}else{R=[HD].concat(rowsOf(kind));fn='شيت-'+M[kind].n+'.csv'}
 try{const u=URL.createObjectURL(new Blob([csv(R)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);say('تم تجهيز الملف ✓')}catch(e){say('لم يتم حفظ الملف')}}
function expv(){return hdr('تصدير البيانات','احفظ نسخة تُفتح في إكسل أو جوجل شيت')+`<div class="c"><b>الربط مع جوجل شيت</b><label style="margin-top:8px">رابط التطبيق (Web App URL)</label><input class="t" style="font-size:13px;direction:ltr" id="cu" value="${CF.u||''}" placeholder="https://script.google.com/macros/s/.../exec"><label style="margin-top:8px">كلمة السر</label><input class="t" style="font-size:15px;direction:ltr" id="ck" value="${CF.k||''}"><button class="pri" style="margin-top:10px" onclick="saveCF()">حفظ واختبار الاتصال</button><button class="pri x" onclick="sync(true)">مزامنة الآن</button><button class="pri x" onclick="pull(true)">تحميل من الشيت</button><div class="ft" style="margin:10px 0 0;text-align:right">${q?q+' عملية في انتظار الإرسال':'كل البيانات مرسلة'}</div></div>
 <div class="c"><b>الشيت المجمع</b><button class="xb" onclick="exp('sum')">ملخص كل الموظفين<small>صف لكل موظف: الإضافي، الجزاءات، الغياب، السلف، الإجازات</small></button><button class="xb" onclick="exp('all')">السجل المفصل لكل الأقسام<small>كل العمليات في شيت واحد</small></button></div>
 <div class="c"><b>شيت منفصل لكل قسم</b>${Object.keys(M).map(k=>`<button class="xb" style="border-inline-start:5px solid ${M[k].c}" onclick="exp('${k}')">${M[k].n}</button>`).join('')}</div>`}
function render(){$('app').innerHTML={home,mod,hub,sec,exp:expv}[V]()}
render();if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(CF.u)pull().then(()=>{if(q||!lsg('hr-ts'))sync(true)});
</script></body></html>
